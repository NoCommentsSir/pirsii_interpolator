services:

  redis-db:
    image: redis:latest
    container_name: redis-db
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - ${REDIS_PORT:-6379}:6379
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --notify-keyspace-events Kg
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
        test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping | grep PONG"]
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 80s
  pg-db:
    image: postgres:17
    container_name: pg-db
    restart: always
    env_file:
      - .env
    # environment можно удалить
    # environment:
    #   - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    #   - POSTGRES_USER=${POSTGRES_USER}
    #   - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/create_schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    shm_size: 128mb
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 30s
        timeout: 60s
        retries: 5
        start_period: 80s

  minio-db:
    image: minio/minio:latest
    container_name: minio-db
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - ${MINIO_API_PORT:-9000}:9000
      - ${MINIO_PORT:-9001}:9001
    env_file:
      - .env
    # environment:
    #   - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    #   - MINIO_ROOT_USER=${MINIO_ROOT_USER}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - ${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prom_data:/prometheus
    healthcheck: 
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 20s
      retries: 3
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - ${GRAFANA_PORT:-3000}:3000
    volumes:
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
    env_file:
      - .env
    # environment:
    #   - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
    #   - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD} 


  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: frontend
      restart: unless-stopped
      ports:
        - ${FRONTEND_PORT:-8080}:80


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      redis-db:
        condition: service_healthy
      pg-db:
        condition: service_healthy
      minio-db:
        condition: service_healthy
    ports:
      - ${BACKEND_PORT:-8000}:8000

  worker:
    build:
      context: .
      dockerfile: backend/worker/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      redis-db:
        condition: service_healthy
      pg-db:
        condition: service_healthy
      minio-db:
        condition: service_healthy
    command: ["python", "-m", "backend.worker.worker"]

volumes:
  pg_data:
  minio_data:
  redis_data:
  prom_data:
